<!DOCTYPE html>
<html>
<head>
    <title>My first presentation</title>
    <link rel="stylesheet" href="/vendor/impress.js/css/impress-common.css">
    <style>
    .impress-supported .fallback-message { display: none; }
    body.impress-mobile .step { display:none; }
    body.impress-mobile .step.active,
    body.impress-mobile .step.present,
    body.impress-mobile .step.next,
    body.impress-mobile .step.prev { display:block; }
    </style>
</head>

<body class="impress-not-supported">
    <div class="fallback-message">
        <p>
            Your browser <b>doesn't support the features required</b>
            by impress.js, so you are presented with a simplified version
            of this presentation.
        </p>
    </div>

    <div id="impress-toolbar"><a href="slides" style="margin-right: 1rem;">Slides</a></div>
    <div id="impress-help"></div>

    <div id="impress">
        <div class="step" data-x="0" data-y="0">
            <h1>PAUSE. THINK. PROTECT.</h1>
        </div>

        <div class="step" data-x="1000" data-y="0">
            <h1>CSA001</h1>
            <h2>Cybersecurity Awareness</h2>
            <h3>Introduction to cybersecurity awareness and everyday security practices.</h3>
        </div>

        <div class="step" data-x="2000" data-y="0">
            <h1>My Second Slide</h1>
        </div>
    </div>

    <div class="impress-progressbar"><div></div></div>
    <div class="impress-progress"></div>

    <script src="/vendor/impress.js/js/impress.js"></script>
    <script>
        const impressApi = impress();
        impressApi.init();
    </script>
</body>
</html>
